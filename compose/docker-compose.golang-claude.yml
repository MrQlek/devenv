services:
  golang-claude:
    image: golang-claude-dev:${IMAGE_VERSION:-dev}
    container_name: devenv-${COMPOSE_PROJECT_NAME}-golang-claude
    pull_policy: never
    init: true
    ports:
      - "127.0.0.1:2345:2345"
    volumes:
      - ${_DEVENV_USER_HOME}/.dockerdevenv/go-mod/${IMAGE_VERSION:-dev}:/home/dockergo/go/pkg/mod
      - ${_DEVENV_USER_HOME}/.dockerdevenv/go-cache/${IMAGE_VERSION:-dev}:/home/dockergo/.cache/go-build
      - ${CLAUDE_CONFIG_DIR}:/home/dockergo/.claude
      - ${CLAUDE_CONFIG_FILE}:/home/dockergo/.claude.json
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    working_dir: /workspace
    tty: true
    stdin_open: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: '4'
    tmpfs:
      - /tmp:size=512m