services:
  devenv:
    image: ${DEVENV_IMAGE}:${IMAGE_VERSION:-dev}
    container_name: devenv-${COMPOSE_PROJECT_NAME}-${DEVENV_LANG}
    hostname: devenv-${DEVENV_LANG}
    pull_policy: never
    init: true
    working_dir: /workspace
    tty: true
    stdin_open: true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: '4'
    tmpfs:
      - /tmp:size=512m
      - /workspace/.devenv_exclude:size=1m
